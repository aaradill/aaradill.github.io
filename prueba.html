<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX Math Example</title>
  <!-- Load MathJax Engine -->
  <script src="https://polyfill.io"></script>
  <script id="MathJax-script" async src="https://jsdelivr.net"></script>
</head>
<body>

  <h1>Mathematical Equations</h1>
  
  <!-- Inline Math Example -->
  <p>The equation for a straight line is \( y = mx + b \), where \( m \) is the slope.</p>
  
  <!-- Block Math Example -->
  <p>Here is the famous quadratic formula displayed on its own line:</p>
  $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

</body>
</html>
